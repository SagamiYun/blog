base_url = "https://blog.sagamiyun.me"
title = "Kit Kyo // ΛΟΓΟΣ"
description = "edge & on-prem AI infra · Tokyo"
author = "Kit Kyo"
default_language = "en"

generate_feeds = true
compile_sass = true
minify_html = true

taxonomies = [
    { name = "tags", feed = true },
]

build_search_index = false

[markdown]
bottom_footnotes = true
smart_punctuation = true
render_emoji = false
external_links_class = "external"
github_alerts = true

[markdown.highlighting]
style = "inline"
theme = "catppuccin-mocha"

[extra]
color_scheme = "oled-abyss"
layout = "center"
show_default_author = false
feed_icon = true
copy_button = true
header_title = "[+] Kit Kyo // ΛΟΓΟΣ"

stylesheets = ["kenosis.css"]

copyright = "© $YEAR Kit Kyo :: // κένωσις · sagamiyun"

main_menu = [
    { name = "> blog", url = "blog", trailing_slash = true },
    { name = "> tags", url = "tags", trailing_slash = true },
    { name = "> about", url = "about", trailing_slash = true },
    { name = "> portal", url = "https://sagamiyun.me", new_tab = false },
    { name = "> github", url = "https://github.com/SagamiYun", new_tab = true },
]

socials = [
    { name = "github", url = "https://github.com/SagamiYun" },
    { name = "x", url = "https://x.com/Kit_KyoD" },
]

[extra.content_security_policy]
enable = false

[extra.responsive_images]
widths = [640, 784, 1280, 1920, 2560]
fallback_width = 1280
